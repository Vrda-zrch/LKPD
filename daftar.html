<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Ekstrakulikuler</title>
</head>
<body>
    <h2>Form Pendaftaran Ekstrakulikuler</h2>
    <label>Nama Lengkap:</label><br>
    <input type="text" id="nama_lengkap" placeholder="Masukkan Nama Anda" required> <br><br>
    <label>Tanggal Lahir:</label><br>
    <input type="date" id="Tanggal" required> <br><br>
    <label>No Telepon:</label><br>
    <input type="number" id="no" placeholder="Masukkan No Anda" required> <br><br>
    <button type="submit">Daftar</button>
</body>
</body>
</body>
</html>
